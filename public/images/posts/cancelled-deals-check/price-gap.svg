<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="취소된 거래 537건을 같은 단지 같은 면적대 정상거래 중앙값과 비교하면 5퍼센트 넘게 싸게 106건, 5퍼센트 이내로 싸게 160건, 같은 값 68건, 5퍼센트 이내로 비싸게 139건, 5퍼센트 넘게 비싸게 64건이다">
  <rect width="640" height="340" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">취소된 거래는 더 비쌌을까</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">같은 단지·같은 면적대(±3㎡) 정상거래 중앙값과 비교 · 537건</text>

  <!-- 막대 (1건 = 2.6px, 최대 160건 = 416px) -->
  <text x="196" y="104" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">5% 넘게 싸게</text>
  <rect x="206" y="88" width="276" height="24" rx="4" fill="#1F7A3D"/>
  <text x="492" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F7A3D">106건 · 19.7%</text>

  <text x="196" y="140" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">5% 이내로 싸게</text>
  <rect x="206" y="124" width="416" height="24" rx="4" fill="#4E9E6A"/>
  <text x="206" y="141" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" dx="8">160건 · 29.8%</text>

  <text x="196" y="176" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F2328">같은 값 (정확히 0%)</text>
  <rect x="206" y="160" width="177" height="24" rx="4" fill="#B8B2A0"/>
  <text x="393" y="177" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B7280">68건 · 12.7%</text>

  <text x="196" y="212" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">5% 이내로 비싸게</text>
  <rect x="206" y="196" width="361" height="24" rx="4" fill="#E8642F"/>
  <text x="206" y="213" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" dx="8">139건 · 25.9%</text>

  <text x="196" y="248" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">5% 넘게 비싸게</text>
  <rect x="206" y="232" width="166" height="24" rx="4" fill="#B4501F"/>
  <text x="382" y="249" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">64건 · 11.9%</text>

  <line x1="32" y1="272" x2="608" y2="272" stroke="#E5E0D0"/>
  <text x="32" y="296" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">비싸지 않았던 쪽(같거나 쌌음) <tspan fill="#1F7A3D">62.2%</tspan> · 비쌌던 쪽 <tspan fill="#E8642F">37.8%</tspan></text>

  <text x="32" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">경계 · 「같은 값」은 정확히 0%만 · 「5% 이내」는 5.0% 포함 · 「5% 넘게」는 5.0% 미포함 · 다섯 칸 합 537건 = 100.0%</text>
</svg>
