<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="계약월별 해제율은 4월 2.82퍼센트, 5월 2.58퍼센트, 6월 2.55퍼센트, 7월 2.02퍼센트다. 계약이 최근일수록 낮게 나오는데 해제까지 중앙값 32일 최장 137일이 걸리므로 네 달 모두 아직 확정값이 아니다">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">최근 달이 낮은 건 아직 시간이 안 지나서예요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">계약월별 해제율 · 서울 아파트 매매 · 2026년 4~7월 계약분</text>

  <line x1="60" y1="230" x2="600" y2="230" stroke="#D8D2C0"/>

  <!-- 막대: 3% = 150px -->
  <rect x="90"  y="89"  width="90" height="141" rx="4" fill="#D8D2C0"/>
  <rect x="230" y="101" width="90" height="129" rx="4" fill="#D8D2C0"/>
  <rect x="370" y="103" width="90" height="127" rx="4" fill="#D8D2C0"/>
  <rect x="510" y="129" width="90" height="101" rx="4" fill="#E8642F"/>

  <text x="135" y="81"  text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4B5563">2.82%</text>
  <text x="275" y="93"  text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4B5563">2.58%</text>
  <text x="415" y="95"  text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4B5563">2.55%</text>
  <text x="555" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8642F">2.02%</text>

  <text x="135" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">4월</text>
  <text x="275" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">5월</text>
  <text x="415" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">6월</text>
  <text x="555" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8642F">7월</text>

  <text x="135" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">251/8,911</text>
  <text x="275" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">237/9,185</text>
  <text x="415" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">138/5,414</text>
  <text x="555" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">120/5,934</text>

  <text x="32" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">해제까지 중앙값 32일·최장 137일 → 7월만이 아니라 네 달 모두 아직 확정값이 아닙니다 · 국토교통부 실거래가 직접 집계</text>
</svg>
