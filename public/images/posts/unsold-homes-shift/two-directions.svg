<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="2026년 7월 전체 미분양은 1.1퍼센트 늘었지만 준공 후 미분양은 2.1퍼센트 줄어 두 지표가 반대 방향으로 움직였다">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">같은 달에 하나는 늘고 하나는 줄었어요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2026년 7월 말 · 전월 대비</text>

  <!-- 왼쪽: 전체 미분양 -->
  <rect x="32" y="86" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">전체 미분양</text>
  <text x="52" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">아직 안 팔린 집 전부</text>
  <text x="52" y="176" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2328">6만 8,217</text>
  <text x="176" y="176" font-family="system-ui, sans-serif" font-size="14" fill="#6B7280">가구</text>
  <text x="52" y="206" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#E8642F">▲ 753가구 · +1.1%</text>
  <text x="52" y="230" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">늘었습니다</text>

  <!-- 오른쪽: 준공 후 -->
  <rect x="328" y="86" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="348" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">준공 후 미분양</text>
  <text x="348" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">다 지어졌는데 안 팔린 집</text>
  <text x="348" y="176" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2328">2만 9,152</text>
  <text x="472" y="176" font-family="system-ui, sans-serif" font-size="14" fill="#6B7280">가구</text>
  <text x="348" y="206" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F7A3D">▼ 634가구 · −2.1%</text>
  <text x="348" y="230" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">줄었습니다</text>

  <text x="32" y="272" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">그래서 "미분양이 늘었다"와 "악성 미분양이 줄었다"가 같은 달에 둘 다 맞습니다</text>
  <text x="32" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">국토교통부 2026년 7월 주택통계 · 준공 후 미분양은 전체 미분양 안에 포함된 숫자입니다(42.7%)</text>
</svg>
