<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="연 금융소득 2천만 원 이하이면 15.4퍼센트 원천징수 분리과세로 끝나고 신고가 필요 없지만, 초과하면 초과분이 다른 소득과 합산되어 6에서 45퍼센트 누진세율로 종합과세되고 5월 종합소득세 신고가 필요하며 건강보험료에도 영향을 줄 수 있다는 비교표">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">넘으면 뭐가 달라질까</text>

  <!-- 2000 이하 -->
  <rect x="40" y="62" width="310" height="200" rx="14" fill="#e6f4ec" stroke="#bfe3cf"/>
  <text x="195" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#2f7d54">2,000만 원 이하</text>
  <text x="195" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d54">분리과세로 끝</text>
  <g font-size="12.5" fill="#3f6350">
    <text x="60" y="146">• 15.4% 원천징수만</text>
    <text x="60" y="172">• 따로 신고 필요 없음</text>
    <text x="60" y="198">• 다른 소득과 안 합쳐짐</text>
    <text x="60" y="224">• 건보료 영향 거의 없음</text>
  </g>
  <text x="195" y="250" text-anchor="middle" font-size="11.5" fill="#8a9a90">대부분의 개인이 여기</text>

  <!-- 2000 초과 -->
  <rect x="370" y="62" width="310" height="200" rx="14" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="525" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#c0392b">2,000만 원 초과</text>
  <text x="525" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">종합과세 대상</text>
  <g font-size="12.5" fill="#8a5a52">
    <text x="390" y="146">• 초과분을 다른 소득과 합산</text>
    <text x="390" y="172">• 누진세율 6~45% 적용</text>
    <text x="390" y="198">• 5월 종합소득세 신고 필요</text>
    <text x="390" y="224">• 건강보험료에 영향 줄 수 있음</text>
  </g>
  <text x="525" y="250" text-anchor="middle" font-size="11.5" fill="#b0857d">소득 클수록 세부담 커짐</text>

  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#b08968">일반 원리 · 실제 세액·건보료는 개인 소득·공제·제도 기준에 따라 다름</text>
</svg>
