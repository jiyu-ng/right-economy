<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Pretendard, sans-serif" role="img" aria-label="내 대지지분을 확인하는 세 가지 방법. 등기부등본 표제부의 대지권 비율, 정부24 집합건축물대장 전유부, 경매 물건은 감정평가서에 대지권 제곱미터가 바로 표시된다">
  <rect width="720" height="250" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">내 대지지분, 어디서 확인할까</text>

  <g>
    <rect x="36" y="66" width="205" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <circle cx="66" cy="98" r="15" fill="#fde3d3"/><text x="66" y="103" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">1</text>
    <text x="90" y="103" font-size="13.5" font-weight="800" fill="#7c2d12">등기부등본</text>
    <text x="56" y="132" font-size="12" fill="#5f4a3a">'표제부'의 '대지권의</text>
    <text x="56" y="151" font-size="12" fill="#5f4a3a">표시'에 <tspan font-weight="700">비율</tspan>로 나와요.</text>
    <text x="56" y="172" font-size="12" fill="#5f4a3a">(예: 1000분의 30)</text>
    <text x="56" y="193" font-size="12" fill="#8a6d5a">전체 대지 × 비율 = 내 ㎡</text>
  </g>

  <g>
    <rect x="257" y="66" width="205" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <circle cx="287" cy="98" r="15" fill="#fde3d3"/><text x="287" y="103" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">2</text>
    <text x="311" y="103" font-size="13.5" font-weight="800" fill="#7c2d12">집합건축물대장</text>
    <text x="277" y="132" font-size="12" fill="#5f4a3a">정부24에서 무료 발급.</text>
    <text x="277" y="151" font-size="12" fill="#5f4a3a">'전유부'에 대지권</text>
    <text x="277" y="170" font-size="12" fill="#5f4a3a">지분이 표시돼요.</text>
    <text x="277" y="193" font-size="12" fill="#8a6d5a">앱(디스코·아실)도 가능</text>
  </g>

  <g>
    <rect x="478" y="66" width="206" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <circle cx="508" cy="98" r="15" fill="#fde3d3"/><text x="508" y="103" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">3</text>
    <text x="532" y="103" font-size="13.5" font-weight="800" fill="#7c2d12">경매 감정평가서</text>
    <text x="498" y="132" font-size="12" fill="#5f4a3a">경매 물건이면 감정서에</text>
    <text x="498" y="151" font-size="12" font-weight="700" fill="#c2410c">'대지권 ○○㎡'가</text>
    <text x="498" y="170" font-size="12" font-weight="700" fill="#c2410c">바로 박혀 있어요.</text>
    <text x="498" y="193" font-size="12" fill="#8a6d5a">등기 안 떼도 확인 OK</text>
  </g>

  <text x="360" y="238" text-anchor="middle" font-size="11" fill="#b08968">공식 확인 경로 · 비율만 나오면 전체 대지면적을 곱해 ㎡로 환산</text>
</svg>
