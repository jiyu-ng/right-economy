<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="재개발 감정평가에서 헌 건물값은 철거 대상이라 거의 반영되지 않고, 내 몫의 땅인 대지지분이 감정평가액의 대부분을 차지한다는 도식">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">재개발 감정평가 = 사실상 '땅값'</text>

  <!-- 일반 매매 -->
  <text x="185" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#8a6d5a">평소 집값(매매)</text>
  <rect x="120" y="95" width="130" height="70" fill="#e8853b"/>
  <text x="185" y="135" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">건물값</text>
  <rect x="120" y="165" width="130" height="70" fill="#c9a98f"/>
  <text x="185" y="205" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">땅값(대지지분)</text>
  <text x="185" y="255" text-anchor="middle" font-size="11.5" fill="#8a6d5a">건물+땅 둘 다 값이 있음</text>

  <text x="360" y="170" text-anchor="middle" font-size="30" fill="#c2410c">➡</text>
  <text x="360" y="195" text-anchor="middle" font-size="11.5" fill="#b08968">재개발 들어가면</text>

  <!-- 재개발 감정평가 -->
  <text x="535" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">재개발 감정평가</text>
  <rect x="470" y="95" width="130" height="26" fill="#eadfd6"/>
  <text x="535" y="112" text-anchor="middle" font-size="11" fill="#b08968">건물값 ≈ 0 (철거 대상)</text>
  <rect x="470" y="121" width="130" height="114" fill="#c9a98f"/>
  <text x="535" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">땅값</text>
  <text x="535" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">(대지지분)</text>
  <text x="535" y="255" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">헌 건물은 안 쳐줌 → 땅이 전부</text>

  <text x="360" y="288" text-anchor="middle" font-size="11" fill="#b08968">개념 도식 · 실제 평가는 감정평가사가 개별 산정 · 출처: 재개발 감정평가 원리 기반 재구성</text>
</svg>
