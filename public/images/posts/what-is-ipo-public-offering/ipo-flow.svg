<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img"
     aria-label="비상장 기업이 상장을 준비하며 수요예측으로 공모가를 정하고, 투자자가 청약 후 배정을 받아 상장일에 거래되는 공모주 청약의 4단계 흐름 도식.">
  <style>
    .t   { font-family: Pretendard, system-ui, sans-serif; }
    .ttl { font-weight: 800; }
    .lbl { font-weight: 700; }
    .sub { font-weight: 500; }
  </style>
  <rect x="0" y="0" width="760" height="250" fill="#ffffff"/>

  <text x="380" y="38" text-anchor="middle" class="t ttl" font-size="21" fill="#1f2a44">공모주가 내 계좌에 들어오기까지 4단계</text>

  <!-- 1 -->
  <rect x="30" y="72" width="160" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="60" cy="102" r="15" fill="#e8612c"/>
  <text x="60" y="108" text-anchor="middle" class="t ttl" font-size="16" fill="#ffffff">1</text>
  <text x="110" y="107" text-anchor="middle" class="t lbl" font-size="15" fill="#334155">상장 준비</text>
  <text x="110" y="138" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">비상장 기업이</text>
  <text x="110" y="158" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">상장 신청</text>

  <!-- arrow -->
  <text x="203" y="132" text-anchor="middle" class="t ttl" font-size="20" fill="#e8612c">›</text>

  <!-- 2 -->
  <rect x="216" y="72" width="160" height="110" rx="14" fill="#fff4ee" stroke="#e8612c" stroke-width="2.5"/>
  <circle cx="246" cy="102" r="15" fill="#e8612c"/>
  <text x="246" y="108" text-anchor="middle" class="t ttl" font-size="16" fill="#ffffff">2</text>
  <text x="296" y="107" text-anchor="middle" class="t lbl" font-size="15" fill="#c14e1f">수요예측</text>
  <text x="296" y="138" text-anchor="middle" class="t sub" font-size="12.5" fill="#9a5a3c">기관 수요 조사로</text>
  <text x="296" y="158" text-anchor="middle" class="t sub" font-size="12.5" fill="#9a5a3c">공모가 확정</text>

  <text x="389" y="132" text-anchor="middle" class="t ttl" font-size="20" fill="#e8612c">›</text>

  <!-- 3 -->
  <rect x="402" y="72" width="160" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="432" cy="102" r="15" fill="#e8612c"/>
  <text x="432" y="108" text-anchor="middle" class="t ttl" font-size="16" fill="#ffffff">3</text>
  <text x="482" y="107" text-anchor="middle" class="t lbl" font-size="15" fill="#334155">청약·배정</text>
  <text x="482" y="138" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">투자자가 신청하고</text>
  <text x="482" y="158" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">경쟁률 따라 배정</text>

  <text x="575" y="132" text-anchor="middle" class="t ttl" font-size="20" fill="#e8612c">›</text>

  <!-- 4 -->
  <rect x="588" y="72" width="150" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="618" cy="102" r="15" fill="#e8612c"/>
  <text x="618" y="108" text-anchor="middle" class="t ttl" font-size="16" fill="#ffffff">4</text>
  <text x="668" y="107" text-anchor="middle" class="t lbl" font-size="15" fill="#334155">상장·거래</text>
  <text x="663" y="138" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">상장일부터</text>
  <text x="663" y="158" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">시장에서 매매</text>

  <text x="380" y="218" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">공모가는 '기관 수요예측'으로 정해지고, 개인은 '청약 경쟁률'에 따라 배정 수량이 달라진다</text>
  <text x="380" y="238" text-anchor="middle" class="t sub" font-size="11" fill="#94a3b8">※ 이해를 돕기 위한 개념 도식 · 절차·용어는 국내 IPO 일반 흐름 기준</text>
</svg>
