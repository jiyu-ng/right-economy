<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="서울 아파트 월세 비중 50.3퍼센트, 빌라 62.8퍼센트, 격차 12.5퍼센트포인트">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">서울 전월세 중 월세가 차지하는 비중</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2026년 1~7월 · 25개 구 · 막대 전체 길이 = 각 유형의 전월세 100%</text>

  <!-- 스케일: 0%=x150, 100%=x600 → 1%당 4.5px -->
  <!-- 아파트 50.3% -->
  <text x="140" y="122" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">아파트</text>
  <text x="140" y="140" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">138,624건</text>
  <rect x="150" y="100" width="450" height="34" rx="5" fill="#D8D2C0"/>
  <rect x="150" y="100" width="226" height="34" rx="5" fill="#E8642F"/>
  <text x="166" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">월세 50.3%</text>
  <text x="590" y="122" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">전세 49.7%</text>

  <!-- 빌라 62.8% -->
  <text x="140" y="197" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">빌라</text>
  <text x="140" y="215" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">84,504건</text>
  <rect x="150" y="175" width="450" height="34" rx="5" fill="#D8D2C0"/>
  <rect x="150" y="175" width="283" height="34" rx="5" fill="#E8642F"/>
  <text x="166" y="197" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">월세 62.8%</text>
  <text x="590" y="197" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">전세 37.2%</text>

  <!-- 격차 표시 -->
  <line x1="376" y1="134" x2="376" y2="175" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="433" y1="209" x2="433" y2="240" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="376" y1="240" x2="433" y2="240" stroke="#4B5563" stroke-width="1.5"/>
  <text x="404" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">12.5%p</text>

  <text x="32" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">기준 · 2026-09-03 조회 · 출처 · 국토교통부 실거래가 공개시스템 원자료 직접 집계(요청 175건 중 실패 0건) · 빌라=연립·다세대</text>
</svg>
