<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="사회임대주택 비중 비교 — 빈 44퍼센트, 네덜란드 33퍼센트 이상, 덴마크 20퍼센트, 한국 2에서 10퍼센트">
  <rect width="640" height="320" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">사회임대주택이 전체 주택에서 차지하는 비중</text>
  <text x="32" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">가로 눈금 1칸 = 10% · 막대 끝 숫자는 비중</text>

  <!-- 눈금 -->
  <line x1="180" y1="80" x2="180" y2="258" stroke="#E5E0D0" stroke-width="1"/>
  <line x1="280" y1="80" x2="280" y2="258" stroke="#E5E0D0" stroke-width="1"/>
  <line x1="380" y1="80" x2="380" y2="258" stroke="#E5E0D0" stroke-width="1"/>
  <line x1="480" y1="80" x2="480" y2="258" stroke="#E5E0D0" stroke-width="1"/>
  <text x="180" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">10%</text>
  <text x="280" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">20%</text>
  <text x="380" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">30%</text>
  <text x="480" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">40%</text>

  <!-- 빈 44% -->
  <text x="32" y="106" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">빈(오스트리아)</text>
  <rect x="80" y="90" width="440" height="24" rx="5" fill="#E8642F"/>
  <text x="530" y="108" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8642F">약 44%</text>

  <!-- 네덜란드 33%+ -->
  <text x="32" y="148" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">네덜란드</text>
  <rect x="80" y="132" width="333" height="24" rx="5" fill="#F0B840"/>
  <text x="423" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B98A12">1/3 이상</text>

  <!-- 덴마크 20% -->
  <text x="32" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">덴마크</text>
  <rect x="80" y="174" width="200" height="24" rx="5" fill="#C9CDD4"/>
  <text x="290" y="192" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B7280">약 20%</text>

  <!-- 한국 2~10% -->
  <text x="32" y="232" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2328">한국</text>
  <rect x="80" y="216" width="100" height="24" rx="5" fill="#C9CDD4"/>
  <rect x="80" y="216" width="20" height="24" rx="5" fill="#9AA0A6"/>
  <text x="190" y="234" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B7280">2~10%</text>

  <text x="32" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">기준 · OECD Affordable Housing Database(PH4.2, 2023년 조사분) · Society at a Glance 2024 / 빈은 2019년 수치</text>
</svg>
