<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, sans-serif" role="img" aria-label="무이자 할부는 나눠 내도 원금만 내지만 유이자 할부는 매달 할부 수수료가 붙어 총액이 원금보다 커진다는 비교 도식">
  <rect width="720" height="340" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">무이자 할부 vs 유이자 할부</text>
  <text x="360" y="64" text-anchor="middle" font-size="12.5" fill="#8a6d5a">예시: 60만 원짜리 물건을 6개월 할부로 결제할 때</text>

  <!-- 무이자 -->
  <rect x="40" y="95" width="300" height="200" rx="14" fill="#e6f4ec" stroke="#bfe3cf"/>
  <text x="190" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#2f7d54">무이자 할부</text>
  <text x="190" y="158" text-anchor="middle" font-size="13" fill="#2f7d54">매달 10만 원 &#215; 6개월</text>
  <line x1="70" y1="175" x2="310" y2="175" stroke="#bfe3cf"/>
  <text x="190" y="205" text-anchor="middle" font-size="13" fill="#3f6f52">낸 돈 합계</text>
  <text x="190" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="#2f7d54">60만 원</text>
  <text x="190" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f7d54">추가 비용 0원 (원금만)</text>

  <!-- 유이자 -->
  <rect x="380" y="95" width="300" height="200" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="530" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">유이자 할부</text>
  <text x="530" y="158" text-anchor="middle" font-size="13" fill="#b91c1c">매달 원금 + 할부 수수료</text>
  <line x1="410" y1="175" x2="650" y2="175" stroke="#fecaca"/>
  <text x="530" y="205" text-anchor="middle" font-size="13" fill="#9b3b3b">낸 돈 합계</text>
  <text x="530" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="#b91c1c">60만 원 + &#945;</text>
  <text x="530" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">개월 수 늘수록 &#945; 커짐</text>

  <text x="360" y="322" text-anchor="middle" font-size="11.5" fill="#b08968">할부 수수료율·무이자 조건은 카드사·가맹점별로 다름 · 위 숫자는 이해를 돕기 위한 예시</text>
</svg>
