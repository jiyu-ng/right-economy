<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="리츠는 여러 부동산을 담은 회사 지분을 사고, 조각투자는 건물 하나의 수익증권을 산다">
  <rect width="640" height="330" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">무엇을 사는지가 다릅니다</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">이 차이가 세금 규칙까지 갈라놓습니다</text>

  <!-- 리츠 -->
  <rect x="32" y="86" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">상장 리츠</text>
  <text x="52" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">여러 부동산을 담은 회사</text>
  <rect x="52" y="150" width="70" height="42" rx="5" fill="#F0B840"/>
  <rect x="132" y="150" width="70" height="42" rx="5" fill="#F0B840"/>
  <rect x="212" y="150" width="70" height="42" rx="5" fill="#F0B840"/>
  <text x="87" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A5C08">오피스</text>
  <text x="167" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A5C08">물류</text>
  <text x="247" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A5C08">상가</text>
  <text x="52" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">→ 이 회사의 <tspan fill="#E8642F">주식</tspan>을 삽니다</text>
  <text x="52" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">주식 규칙을 따라가서</text>
  <text x="52" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F7A3D">팔 때 차익은 비과세</text>

  <!-- 조각투자 -->
  <rect x="328" y="86" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="348" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">부동산 조각투자</text>
  <text x="348" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">건물 하나</text>
  <rect x="348" y="150" width="230" height="42" rx="5" fill="#E8642F"/>
  <text x="463" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">내가 고른 그 건물</text>
  <text x="348" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">→ 그 건물의 <tspan fill="#E8642F">수익증권</tspan>을 삽니다</text>
  <text x="348" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">주식이 아니라서</text>
  <text x="348" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">팔 때 차익도 15.4%</text>

  <text x="32" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">국내 개인투자자 기준 · 상장 리츠는 국내 상장주식과 같은 취급 · 세제는 상품 구조·보유기간에 따라 달라질 수 있습니다</text>
</svg>
