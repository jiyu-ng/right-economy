<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="유찰 18회를 거친 물건은 감정가 2억 4600만원이 최저가 600만원으로 감정가의 2.4퍼센트가 됐다">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">유찰 18회를 거치면 이렇게 됩니다</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2023타경 사건 · 서울 양천구 빌라 · 2023년 접수</text>

  <!-- 감정가 -->
  <text x="120" y="116" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F2328">감정가</text>
  <rect x="130" y="96" width="460" height="32" rx="5" fill="#D8D2C0"/>
  <text x="578" y="117" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4B5563">2억 4,600만원</text>

  <!-- 최저가 -->
  <text x="120" y="176" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#B4501F">최저가</text>
  <rect x="130" y="156" width="11" height="32" rx="3" fill="#B4501F"/>
  <text x="151" y="177" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B4501F">600만원 · 감정가의 2.4%</text>

  <line x1="32" y1="212" x2="608" y2="212" stroke="#E5E0D0"/>

  <text x="32" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">그런데 이건 「싸진 것」이 아니에요</text>
  <text x="32" y="262" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">18번 나왔고 18번 아무도 안 샀다는 뜻입니다. 더 비쌌던 17번의 기회도 전부 지나갔어요.</text>
  <text x="32" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">저감률 20%로 18회 유찰하면 이론상 감정가의 1.8% · 실제 2.4%와 대체로 맞습니다</text>
</svg>
