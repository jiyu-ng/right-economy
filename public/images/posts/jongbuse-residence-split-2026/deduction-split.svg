<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="실거주 1주택 공제 14억, 비거주 1주택 공제 12억 비교">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">같은 1주택, 공제는 2억 갈립니다</text>
  <text x="32" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280">종부세 기본공제 · 단위 억원</text>

  <!-- 실거주 -->
  <text x="32" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1F2328">실거주 1주택</text>
  <rect x="150" y="100" width="420" height="30" rx="6" fill="#E8642F"/>
  <text x="560" y="121" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">14억</text>
  <text x="150" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">현행 12억 → 14억 (2억 상향, 정부안에 담김)</text>

  <!-- 비거주 -->
  <text x="32" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1F2328">비거주 1주택</text>
  <rect x="150" y="182" width="360" height="30" rx="6" fill="#F0B840"/>
  <text x="500" y="203" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#3F3A2E">12억</text>
  <text x="150" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">원안 9억 → 철회, 현행 12억 유지</text>

  <!-- 차이 표시 -->
  <line x1="510" y1="182" x2="510" y2="140" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="130" x2="570" y2="140" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="140" x2="570" y2="140" stroke="#9CA3AF" stroke-width="1"/>
  <text x="540" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4B5563">2억</text>

  <text x="32" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8A8F98">기준 · 재정경제부 2026.9.1 국무회의 의결 정부안(국회 심사 전) / 출처 · 머니투데이·한국경제 (2026.9.1)</text>
</svg>
