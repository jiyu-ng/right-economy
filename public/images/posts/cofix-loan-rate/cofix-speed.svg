<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"
     aria-label="코픽스 종류별로 금리 변화가 반영되는 속도가 다르다는 비교 그림. 신규취급액기준이 가장 빠르고 잔액기준이 가장 느리다">
  <style>
    .label { font-family: Pretendard, system-ui, sans-serif; font-weight: 700; }
    .sub   { font-family: Pretendard, system-ui, sans-serif; font-weight: 500; }
    .num   { font-family: Pretendard, system-ui, sans-serif; font-weight: 800; }
  </style>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" class="label" font-size="19" fill="#334155">같은 코픽스라도 &#39;반응 속도&#39;가 다릅니다</text>
  <text x="380" y="64" text-anchor="middle" class="sub" font-size="13" fill="#64748b">막대가 길수록 시장금리 변화가 빨리 반영됨</text>

  <!-- 신규취급액 -->
  <text x="24" y="112" class="sub" font-size="15" fill="#475569">신규취급액기준</text>
  <rect x="210" y="94" width="440" height="26" rx="13" fill="#e8612c"/>
  <text x="430" y="113" text-anchor="middle" class="num" font-size="13.5" fill="#ffffff">가장 빠름 — 최근에 새로 조달한 자금만 반영</text>

  <!-- 신잔액 -->
  <text x="24" y="172" class="sub" font-size="15" fill="#475569">신잔액기준</text>
  <rect x="210" y="154" width="285" height="26" rx="13" fill="#f0a06a"/>
  <text x="352" y="173" text-anchor="middle" class="num" font-size="13.5" fill="#ffffff">중간</text>

  <!-- 잔액 -->
  <text x="24" y="232" class="sub" font-size="15" fill="#475569">잔액기준</text>
  <rect x="210" y="214" width="170" height="26" rx="13" fill="#cbd5e1"/>
  <text x="295" y="233" text-anchor="middle" class="num" font-size="13.5" fill="#475569">가장 느림</text>

  <line x1="210" y1="256" x2="650" y2="256" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="210" y="276" class="sub" font-size="12" fill="#94a3b8">느리게 반영</text>
  <text x="650" y="276" text-anchor="end" class="sub" font-size="12" fill="#94a3b8">빠르게 반영</text>

  <rect x="24" y="290" width="626" height="36" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="313" class="sub" font-size="13" fill="#475569">금리가 내릴 땐 빠른 쪽이 유리하고, 오를 땐 느린 쪽이 덜 아픕니다. 방향에 따라 유불리가 뒤집혀요.</text>
</svg>
