<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="물가안정목표제 작동 원리: 물가가 2% 목표를 넘으면 금리를 올리고, 밑돌면 금리를 내려 물가를 목표로 되돌리는 순환 도식">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">중앙은행은 물가를 '2%'로 되돌린다</text>

  <!-- 목표선 -->
  <line x1="70" y1="170" x2="650" y2="170" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="660" y="174" font-size="14" font-weight="800" fill="#c2410c">2%</text>
  <text x="660" y="190" font-size="10" fill="#b08968">목표</text>

  <!-- 위: 물가 과열 -->
  <g>
    <rect x="90" y="70" width="230" height="72" rx="12" fill="#fde3d3" stroke="#e8703a"/>
    <text x="205" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">물가가 2%보다 높다 (과열)</text>
    <text x="205" y="122" text-anchor="middle" font-size="13" fill="#8a4a2c">→ 금리를 올려 돈을 조인다</text>
  </g>
  <!-- 아래: 물가 냉각 -->
  <g>
    <rect x="400" y="198" width="230" height="72" rx="12" fill="#eaf3ee" stroke="#5a9c78"/>
    <text x="515" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#2f7d54">물가가 2%보다 낮다 (냉각)</text>
    <text x="515" y="250" text-anchor="middle" font-size="13" fill="#3f6b52">→ 금리를 내려 돈을 푼다</text>
  </g>

  <!-- 되돌림 화살표 -->
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e8703a"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a9c78"/></marker>
  </defs>
  <path d="M320 106 C 380 106, 380 165, 340 168" fill="none" stroke="#e8703a" stroke-width="2.2" marker-end="url(#a1)"/>
  <path d="M400 234 C 340 234, 340 175, 380 172" fill="none" stroke="#5a9c78" stroke-width="2.2" marker-end="url(#a2)"/>

  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#9a6b4f">물가를 목표(2%) 근처로 되돌리는 '온도 조절기' 같은 장치 · 개념 도식</text>
</svg>
