<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="경매 감정가 최저매각가 시세 세 가격의 기준이 서로 다르다는 도식">
  <rect width="640" height="330" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">같은 물건에 붙는 세 가격, 기준이 다릅니다</text>

  <!-- 감정가 -->
  <rect x="32" y="70" width="576" height="62" rx="8" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="50" y="94" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">감정가</text>
  <text x="140" y="94" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">경매 개시 무렵 평가 — 보통 6~12개월 전 시점</text>
  <text x="140" y="116" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">「반값」이라고 할 때 나누는 기준이 대개 이 값입니다</text>

  <!-- 최저매각가 -->
  <rect x="32" y="142" width="576" height="80" rx="8" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="50" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E8642F">최저매각가</text>
  <text x="160" y="166" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">유찰될 때마다 20~30%씩 기계적으로 저감</text>
  <text x="160" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">시장이 「이 값이 맞다」고 정한 게 아닙니다</text>
  <text x="160" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">자동 계산이라, 낮다는 것 자체는 정보가 아닙니다</text>

  <!-- 시세 -->
  <rect x="32" y="232" width="576" height="62" rx="8" fill="#FFF8E6" stroke="#F0B840" stroke-width="2"/>
  <text x="50" y="256" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7A5C08">시세</text>
  <text x="140" y="256" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">지금 실제로 거래되는 값 — 인근 같은 조건 실거래</text>
  <text x="140" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7A5C08">싸냐 아니냐는 이 값과 견줘야 갈립니다</text>

  <text x="32" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">일반적인 경매 절차 설명 · 저감률은 법원별로 20~30%로 다릅니다</text>
</svg>
