<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img"
     aria-label="점도표 도식. 세로축은 금리, 가로축은 올해 말·내년 말·장기 세 구간이며 각 구간마다 참석자들의 전망이 점으로 흩어져 있고 중앙값이 가로선으로 표시돼 있다.">
  <style>
    .bg{fill:#fbfaf7}
    .ax{stroke:#c9c4bb;stroke-width:1.2}
    .grid{stroke:#e8e4dc;stroke-width:1}
    .lbl{font:13px system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#5a5750}
    .lblb{font:600 13.5px system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#26262c}
    .ttl{font:600 15px system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#26262c}
    .dot{fill:#0b57d0;opacity:.78}
    .med{stroke:#e0483a;stroke-width:2.4;stroke-linecap:round}
    .medl{font:600 12px system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#e0483a}
    .note{font:12px system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#8a8a96}
  </style>
  <rect class="bg" x="0" y="0" width="720" height="430"/>
  <text class="ttl" x="28" y="34">점도표는 이렇게 생겼습니다 — 점 하나 = 참석자 한 명의 전망</text>

  <!-- y grid + labels : 2.0 ~ 4.5 -->
  <g>
    <line class="grid" x1="86" y1="80"  x2="690" y2="80"/>
    <line class="grid" x1="86" y1="134" x2="690" y2="134"/>
    <line class="grid" x1="86" y1="188" x2="690" y2="188"/>
    <line class="grid" x1="86" y1="242" x2="690" y2="242"/>
    <line class="grid" x1="86" y1="296" x2="690" y2="296"/>
    <line class="grid" x1="86" y1="350" x2="690" y2="350"/>
    <text class="lbl" x="52" y="85">4.5</text>
    <text class="lbl" x="52" y="139">4.0</text>
    <text class="lbl" x="52" y="193">3.5</text>
    <text class="lbl" x="52" y="247">3.0</text>
    <text class="lbl" x="52" y="301">2.5</text>
    <text class="lbl" x="52" y="355">2.0</text>
    <text class="lbl" x="28" y="64">금리(%)</text>
  </g>
  <line class="ax" x1="86" y1="350" x2="690" y2="350"/>
  <line class="ax" x1="86" y1="70"  x2="86"  y2="350"/>

  <!-- column 1 : 올해 말 -->
  <g>
    <circle class="dot" cx="168" cy="134" r="6"/>
    <circle class="dot" cx="186" cy="134" r="6"/>
    <circle class="dot" cx="150" cy="161" r="6"/>
    <circle class="dot" cx="168" cy="161" r="6"/>
    <circle class="dot" cx="186" cy="161" r="6"/>
    <circle class="dot" cx="204" cy="161" r="6"/>
    <circle class="dot" cx="150" cy="188" r="6"/>
    <circle class="dot" cx="168" cy="188" r="6"/>
    <circle class="dot" cx="186" cy="188" r="6"/>
    <circle class="dot" cx="204" cy="188" r="6"/>
    <circle class="dot" cx="222" cy="188" r="6"/>
    <circle class="dot" cx="168" cy="215" r="6"/>
    <circle class="dot" cx="186" cy="215" r="6"/>
    <circle class="dot" cx="204" cy="215" r="6"/>
    <circle class="dot" cx="186" cy="242" r="6"/>
    <line class="med" x1="122" y1="188" x2="250" y2="188"/>
    <text class="medl" x="256" y="192">중앙값</text>
    <text class="lblb" x="152" y="382">올해 말</text>
  </g>

  <!-- column 2 : 내년 말 (더 넓게 흩어짐) -->
  <g>
    <circle class="dot" cx="386" cy="134" r="6"/>
    <circle class="dot" cx="368" cy="188" r="6"/>
    <circle class="dot" cx="386" cy="188" r="6"/>
    <circle class="dot" cx="350" cy="215" r="6"/>
    <circle class="dot" cx="368" cy="215" r="6"/>
    <circle class="dot" cx="386" cy="215" r="6"/>
    <circle class="dot" cx="404" cy="215" r="6"/>
    <circle class="dot" cx="350" cy="242" r="6"/>
    <circle class="dot" cx="368" cy="242" r="6"/>
    <circle class="dot" cx="386" cy="242" r="6"/>
    <circle class="dot" cx="404" cy="242" r="6"/>
    <circle class="dot" cx="422" cy="242" r="6"/>
    <circle class="dot" cx="368" cy="269" r="6"/>
    <circle class="dot" cx="386" cy="269" r="6"/>
    <circle class="dot" cx="404" cy="269" r="6"/>
    <circle class="dot" cx="386" cy="296" r="6"/>
    <line class="med" x1="340" y1="242" x2="468" y2="242"/>
    <text class="lblb" x="366" y="382">내년 말</text>
  </g>

  <!-- column 3 : 장기 (좁게 모임) -->
  <g>
    <circle class="dot" cx="577" cy="269" r="6"/>
    <circle class="dot" cx="595" cy="269" r="6"/>
    <circle class="dot" cx="550" cy="296" r="6"/>
    <circle class="dot" cx="568" cy="296" r="6"/>
    <circle class="dot" cx="586" cy="296" r="6"/>
    <circle class="dot" cx="604" cy="296" r="6"/>
    <circle class="dot" cx="622" cy="296" r="6"/>
    <circle class="dot" cx="550" cy="323" r="6"/>
    <circle class="dot" cx="568" cy="323" r="6"/>
    <circle class="dot" cx="586" cy="323" r="6"/>
    <circle class="dot" cx="604" cy="323" r="6"/>
    <circle class="dot" cx="622" cy="323" r="6"/>
    <line class="med" x1="540" y1="296" x2="668" y2="296"/>
    <text class="lblb" x="576" y="382">장기</text>
  </g>

  <text class="note" x="28" y="410">가장 넓게 흩어지는 건 1~2년 뒤 구간입니다 — 당장은 의견이 모이고, 장기는 '중립금리'라 다시 좁아집니다.</text>
</svg>
