  <text x="220" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">= 「많다」도 「적다」도 말할 수 없는 상태</text>

  <text x="32" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">네 항목 합 5,933건 = 100.00% · 25개 자치구 전수 조회(실패 0) · 계약일 기준</text>
