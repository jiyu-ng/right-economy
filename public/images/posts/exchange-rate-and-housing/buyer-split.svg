  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">서울 아파트는 누가 샀나</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2026년 7월 계약분 5,933건 · 국토교통부 실거래 자료 직접 집계</text>

  <!-- 100% 바 -->
  <rect x="32" y="92" width="576" height="44" rx="6" fill="#E8642F"/>
  <rect x="570" y="92" width="37" height="44" fill="#4B5563"/>
