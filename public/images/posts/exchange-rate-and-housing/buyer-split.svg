  <text x="48" y="120" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">개인 93.46%</text>

  <text x="32" y="168" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">■ 개인</text>
  <text x="150" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8642F">5,545건 · 93.46%</text>
  <text x="32" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">■ 공공기관</text>
  <text x="150" y="192" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">383건 · 6.46%</text>
  <text x="32" y="216" font-family="system-ui, sans-serif" font-size="13" fill="#1F2328">■ 법인</text>
  <text x="150" y="216" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">3건 · 0.05%</text>
