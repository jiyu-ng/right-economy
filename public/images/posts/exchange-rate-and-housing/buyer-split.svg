  <text x="150" y="240" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">2건 · 0.03%</text>

  <rect x="200" y="150" width="408" height="100" rx="8" fill="#FFFFFF" stroke="#E5E0D0"/>
