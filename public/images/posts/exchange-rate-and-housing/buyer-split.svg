<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="2026년 7월 서울 아파트 매매 5933건의 매수자 구분은 개인 93.46퍼센트, 공공기관 6.46퍼센트, 법인 0.05퍼센트, 기타 0.03퍼센트이며 외국인 구분 항목은 없다">
