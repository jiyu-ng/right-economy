<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="환율이 집값에 닿는 통로는 금리, 건설 원가, 외국인 자금 세 갈래이며 각각 시차와 크기가 다르다">
  <rect width="640" height="340" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">환율이 집값에 닿는 길</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">세 갈래인데 굵기도 걸리는 시간도 다릅니다</text>

  <!-- 출발 -->
  <rect x="32" y="92" width="112" height="52" rx="8" fill="#1F2328"/>
  <text x="88" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">환율 하락</text>
  <text x="88" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#D8D2C0">원화가 강해짐</text>

  <!-- ① 금리 -->
  <line x1="144" y1="112" x2="196" y2="112" stroke="#E8642F" stroke-width="6"/>
  <rect x="196" y="88" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="210" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">① 물가 → 금리</text>
  <text x="210" y="126" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">수입물가 안정 → 금리 여지</text>
  <text x="410" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E8642F">굵음</text>
  <text x="410" y="126" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">느림 · 수개월~</text>

  <!-- ② 원가 -->
  <line x1="144" y1="120" x2="196" y2="180" stroke="#B8B2A0" stroke-width="4"/>
  <rect x="196" y="156" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="210" y="176" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">② 수입 자재값</text>
  <text x="210" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">공사비 → 분양가</text>
  <text x="410" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4B5563">중간</text>
  <text x="410" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">아주 느림 · 착공~입주</text>

  <!-- ③ 외국인 -->
  <line x1="144" y1="128" x2="196" y2="248" stroke="#D8D2C0" stroke-width="2"/>
  <rect x="196" y="224" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="210" y="244" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">③ 외국인 자금</text>
  <text x="210" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">환차익 기대 → 매수</text>
  <text x="410" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A8F98">크기 미확인</text>
  <text x="410" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">빠름</text>

  <line x1="32" y1="292" x2="608" y2="292" stroke="#E5E0D0"/>
  <text x="32" y="314" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">굵은 길일수록 느리고, 빠른 길은 크기를 잴 수 없습니다</text>
  <text x="32" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">③은 실거래 자료에 외국인 구분이 없어 크기를 확인하지 못했습니다(본문 참조)</text>
</svg>
