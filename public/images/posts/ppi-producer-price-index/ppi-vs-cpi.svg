<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, sans-serif" role="img" aria-label="생산자물가지수 PPI와 소비자물가지수 CPI를 측정 단계·대상·발표기관·의미로 비교한 표">
  <rect width="720" height="340" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">PPI vs CPI, 무엇이 다른가</text>

  <!-- 헤더 -->
  <g font-size="15" font-weight="800">
    <rect x="40" y="62" width="200" height="46" fill="#f6ede6"/>
    <rect x="240" y="62" width="220" height="46" fill="#fde3d3"/>
    <rect x="460" y="62" width="220" height="46" fill="#fef3ec"/>
    <text x="140" y="91" text-anchor="middle" fill="#7c2d12">구분</text>
    <text x="350" y="91" text-anchor="middle" fill="#c2410c">PPI (생산자물가)</text>
    <text x="570" y="91" text-anchor="middle" fill="#7c2d12">CPI (소비자물가)</text>
  </g>

  <!-- 행 -->
  <g font-size="13.5">
    <!-- row labels -->
    <text x="52" y="140" font-weight="700" fill="#7c2d12">측정 단계</text>
    <text x="350" y="140" text-anchor="middle" fill="#8a4a2c">공장 출하(도매) 단계</text>
    <text x="570" y="140" text-anchor="middle" fill="#5a4636">소매·최종 소비 단계</text>

    <text x="52" y="182" font-weight="700" fill="#7c2d12">담는 항목</text>
    <text x="350" y="182" text-anchor="middle" fill="#8a4a2c">원자재·중간재·서비스</text>
    <text x="570" y="182" text-anchor="middle" fill="#5a4636">생활에 쓰는 상품·서비스</text>

    <text x="52" y="224" font-weight="700" fill="#7c2d12">발표 기관</text>
    <text x="350" y="224" text-anchor="middle" fill="#8a4a2c">한국은행 (미국: 노동부 BLS)</text>
    <text x="570" y="224" text-anchor="middle" fill="#5a4636">통계청 (미국: 노동부 BLS)</text>

    <text x="52" y="266" font-weight="700" fill="#7c2d12">시장이 보는 의미</text>
    <text x="350" y="266" text-anchor="middle" font-weight="700" fill="#c2410c">앞으로 올 물가의 '예고'</text>
    <text x="570" y="266" text-anchor="middle" fill="#5a4636">체감·통화정책의 기준</text>
  </g>

  <!-- 구분선 -->
  <g stroke="#eaddd3" stroke-width="1">
    <line x1="40" y1="108" x2="680" y2="108"/>
    <line x1="40" y1="155" x2="680" y2="155"/>
    <line x1="40" y1="197" x2="680" y2="197"/>
    <line x1="40" y1="239" x2="680" y2="239"/>
    <line x1="240" y1="62" x2="240" y2="281"/>
    <line x1="460" y1="62" x2="460" y2="281"/>
  </g>
  <rect x="40" y="62" width="640" height="219" fill="none" stroke="#eaddd3"/>

  <text x="360" y="312" text-anchor="middle" font-size="11" fill="#b08968">개념 비교 도식 · 한국 기준(괄호는 미국) · 출처: 한국은행·통계청 통계 설명 기반 재구성</text>
</svg>
