<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img"
     aria-label="대출금리는 기준금리에 가산금리를 더하고 가감조정금리를 빼서 정해진다는 산식 도식">
  <style>
    .label { font-family: Pretendard, system-ui, sans-serif; font-weight: 700; }
    .sub   { font-family: Pretendard, system-ui, sans-serif; font-weight: 500; }
    .num   { font-family: Pretendard, system-ui, sans-serif; font-weight: 800; }
    .op    { font-family: Pretendard, system-ui, sans-serif; font-weight: 800; fill: #64748b; }
  </style>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" class="label" font-size="19" fill="#334155">은행연합회가 이 세 칸으로 나눠서 공시합니다</text>

  <rect x="20" y="76" width="190" height="128" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="112" text-anchor="middle" class="sub" font-size="15" fill="#475569">기준금리</text>
  <text x="115" y="148" text-anchor="middle" class="num" font-size="24" fill="#334155">시장이 정함</text>
  <text x="115" y="176" text-anchor="middle" class="sub" font-size="12.5" fill="#64748b">코픽스 등 · 매월 공시</text>

  <text x="233" y="150" text-anchor="middle" class="op" font-size="40">+</text>

  <rect x="256" y="76" width="190" height="128" rx="16" fill="#fff4ee" stroke="#e8612c" stroke-width="2"/>
  <text x="351" y="112" text-anchor="middle" class="sub" font-size="15" fill="#9a5a3c">가산금리</text>
  <text x="351" y="148" text-anchor="middle" class="num" font-size="24" fill="#e8612c">은행이 정함</text>
  <text x="351" y="176" text-anchor="middle" class="sub" font-size="12.5" fill="#9a5a3c">원가 · 위험 · 마진</text>

  <text x="469" y="150" text-anchor="middle" class="op" font-size="40">−</text>

  <rect x="492" y="76" width="190" height="128" rx="16" fill="#eef7f0" stroke="#3f9e63" stroke-width="2"/>
  <text x="587" y="112" text-anchor="middle" class="sub" font-size="15" fill="#2f6b47">가감조정금리</text>
  <text x="587" y="148" text-anchor="middle" class="num" font-size="24" fill="#3f9e63">깎는 칸</text>
  <text x="587" y="176" text-anchor="middle" class="sub" font-size="12.5" fill="#2f6b47">전결·우대 등</text>

  <text x="712" y="150" text-anchor="middle" class="op" font-size="30">=</text>
  <text x="712" y="182" text-anchor="middle" class="num" font-size="14" fill="#334155">내 금리</text>

  <rect x="20" y="228" width="662" height="52" rx="12" fill="#fffbf5" stroke="#f0d9c4" stroke-width="1.5"/>
  <text x="40" y="251" class="sub" font-size="13.5" fill="#7c5c46">2019년 7월부터 가운데 칸에서 「가감조정금리」를 따로 떼어 공시합니다.</text>
  <text x="40" y="271" class="sub" font-size="13.5" fill="#7c5c46">전엔 가산금리 안에 섞여 있어서 얼마를 깎아준 건지 밖에서 볼 수 없었어요.</text>
</svg>
