<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="표면금리에서 15.4퍼센트를 뺀 세후 이자율을 보여주는 표. 연 3퍼센트는 2.538퍼센트, 4퍼센트는 3.384퍼센트, 5퍼센트는 4.23퍼센트가 된다">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12.5px; fill: #6b7280; }
    .hd { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .g { font-size: 20px; font-weight: 700; fill: #4b5563; }
    .n { font-size: 20px; font-weight: 800; fill: #ea580c; }
    .cap { font-size: 11.5px; fill: #8a8f98; }
  </style>
  <rect width="640" height="360" fill="#ffffff"/>
  <text class="t title" x="28" y="34">표면금리에서 세금을 빼면</text>
  <text class="t sub" x="28" y="55">이자소득세 15.4%를 떼고 나면 84.6%만 남습니다</text>

  <line x1="28" y1="76" x2="612" y2="76" stroke="#e5e7eb"/>
  <text class="t hd" x="60" y="98">표면금리</text>
  <text class="t hd" x="300" y="98" text-anchor="middle">→</text>
  <text class="t hd" x="470" y="98">세후 이자율</text>
  <line x1="28" y1="110" x2="612" y2="110" stroke="#e5e7eb"/>

  <g class="t">
    <text class="g" x="60" y="146">연 3%</text><text class="n" x="470" y="146">2.538%</text>
    <line x1="28" y1="164" x2="612" y2="164" stroke="#f3f4f6"/>
    <text class="g" x="60" y="200">연 4%</text><text class="n" x="470" y="200">3.384%</text>
    <line x1="28" y1="218" x2="612" y2="218" stroke="#f3f4f6"/>
    <text class="g" x="60" y="254">연 5%</text><text class="n" x="470" y="254">4.230%</text>
  </g>
  <line x1="28" y1="272" x2="612" y2="272" stroke="#e5e7eb"/>

  <rect x="28" y="290" width="584" height="46" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="t" x="46" y="312" font-size="13" fill="#374151">세후로 바꾸려면 <tspan font-weight="700" fill="#9a3412">× 0.846</tspan>, 비과세를 세전으로 올리려면 <tspan font-weight="700" fill="#9a3412">÷ 0.846</tspan></text>
  <text class="t cap" x="46" y="330">비과세 3.5% ÷ 0.846 = 4.137% — 예금이 4.14%는 돼야 같아집니다</text>
</svg>
