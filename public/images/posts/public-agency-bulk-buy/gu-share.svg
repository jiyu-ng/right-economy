<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="2026년 7월 서울 아파트 매매에서 공공기관 매수는 중랑구 506건 중 297건으로 58.7퍼센트, 동작구 27.0퍼센트, 서초구 14.8퍼센트, 강서구 0.3퍼센트이고 나머지 21개 구는 0건이다">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">공공기관 매수는 네 구에만 있었어요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2026년 7월 계약분 · 서울 25개 자치구 전수 · 그 구 매매에서 차지하는 비중</text>

  <text x="96" y="106" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B4501F">중랑구</text>
  <rect x="106" y="88" width="322" height="26" rx="4" fill="#B4501F"/>
  <text x="438" y="107" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B4501F">58.7%  (297/506건)</text>

  <text x="96" y="146" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8642F">동작구</text>
  <rect x="106" y="128" width="148" height="26" rx="4" fill="#E8642F"/>
  <text x="264" y="147" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8642F">27.0%  (65/241건)</text>

  <text x="96" y="186" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4B5563">서초구</text>
  <rect x="106" y="168" width="81" height="26" rx="4" fill="#D8942F"/>
  <text x="197" y="187" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8A6A18">14.8%  (20/135건)</text>

  <text x="96" y="226" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4B5563">강서구</text>
  <rect x="106" y="208" width="4" height="26" rx="2" fill="#B8B2A0"/>
  <text x="120" y="227" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8A8F98">0.3%  (1/394건)</text>

  <line x1="32" y1="252" x2="608" y2="252" stroke="#E5E0D0"/>
  <text x="32" y="274" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">나머지 21개 자치구는 <tspan fill="#1F7A3D">0건</tspan>입니다</text>
  <text x="32" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">네 구 합 383건 = 공공기관 매수 전체 · 국토교통부 실거래 자료 직접 집계(2026.9.8 조회)</text>
</svg>
