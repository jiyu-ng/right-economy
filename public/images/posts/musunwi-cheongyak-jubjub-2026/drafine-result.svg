<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, sans-serif" role="img" aria-label="2026년 8월 노량진 드파인 아르티아 무순위 청약 결과. 15가구 모집에 656건이 접수돼 평균 43.73대 1, 최고 171대 1을 기록했고 국민평형 분양가는 25억3천만원에서 27억1800만원이다">
  <rect width="720" height="360" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">노량진 드파인 아르티아 무순위 청약 결과</text>

  <g>
    <rect x="40" y="66" width="152" height="118" rx="8" fill="#fde3d3"/>
    <rect x="204" y="66" width="152" height="118" rx="8" fill="#f6ede6"/>
    <rect x="368" y="66" width="152" height="118" rx="8" fill="#f6ede6"/>
    <rect x="532" y="66" width="148" height="118" rx="8" fill="#f6ede6"/>

    <text x="116" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d5a">무순위 물량</text>
    <text x="116" y="138" text-anchor="middle" font-size="30" font-weight="800" fill="#c2410c">15</text>
    <text x="116" y="164" text-anchor="middle" font-size="12.5" fill="#8a6d5a">가구</text>

    <text x="280" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d5a">접수 건수</text>
    <text x="280" y="138" text-anchor="middle" font-size="30" font-weight="800" fill="#7c2d12">656</text>
    <text x="280" y="164" text-anchor="middle" font-size="12.5" fill="#8a6d5a">건</text>

    <text x="444" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d5a">평균 경쟁률</text>
    <text x="444" y="138" text-anchor="middle" font-size="30" font-weight="800" fill="#7c2d12">43.7<tspan font-size="16">:1</tspan></text>
    <text x="444" y="164" text-anchor="middle" font-size="12.5" fill="#8a6d5a">15가구 기준</text>

    <text x="606" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d5a">최고 경쟁률</text>
    <text x="606" y="138" text-anchor="middle" font-size="30" font-weight="800" fill="#c2410c">171<tspan font-size="16">:1</tspan></text>
    <text x="606" y="164" text-anchor="middle" font-size="12.5" fill="#8a6d5a">84㎡A · 1가구</text>
  </g>

  <g>
    <rect x="40" y="206" width="640" height="86" rx="8" fill="#fff" stroke="#eaddd3"/>
    <text x="60" y="238" font-size="13.5" font-weight="700" fill="#7c2d12">분양가 (공급금액)</text>
    <text x="60" y="268" font-size="13" fill="#5f4a3a">· 국민평형(전용 84㎡)  <tspan font-weight="800" fill="#c2410c">25억 3,000만 ~ 27억 1,800만 원</tspan></text>
    <text x="400" y="268" font-size="13" fill="#5f4a3a">· 전용 109㎡  <tspan font-weight="800" fill="#7c2d12">29억 5,000만 ~ 30억 6,000만 원</tspan></text>
  </g>

  <text x="360" y="330" text-anchor="middle" font-size="11.5" fill="#b08968">서울 동작구 · 무순위 청약 접수 2026.8.12 (당첨자 발표 8.18) · 출처: 한국부동산원 청약홈, 뉴스핌 보도</text>
</svg>
