<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="집값이 8억 9900만원에서 9억원으로 100만원 오르면 중개보수 상한은 359만 6천원에서 450만원으로 90만 4천원 오른다">
  <rect width="640" height="300" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">집값은 100만원, 복비는 90만원</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">9억 경계를 사이에 둔 두 집 · 상한요율로 계산한 값</text>

  <!-- 왼쪽 -->
  <rect x="32" y="86" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">8억 9,900만원</text>
  <text x="52" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2억~9억 구간 · 상한 0.4%</text>
  <rect x="52" y="152" width="104" height="34" rx="5" fill="#1F7A3D"/>
  <text x="166" y="175" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F7A3D">359만 6천원</text>
  <text x="52" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">9억에 100만원 모자란 집</text>

  <!-- 오른쪽 -->
  <rect x="328" y="86" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="348" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">9억원</text>
  <text x="348" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">9억~12억 구간 · 상한 0.5%</text>
  <rect x="348" y="152" width="130" height="34" rx="5" fill="#E8642F"/>
  <text x="488" y="175" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#E8642F">450만원</text>
  <text x="348" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">경계에 딱 걸린 집</text>

  <!-- 차이 -->
  <text x="320" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">집값 차이 100만원 · 중개보수 차이 <tspan fill="#B4501F">90만 4천원</tspan></text>

  <text x="32" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">서울 조례 상한요율로 계산 · 실제 보수는 상한 안에서 협의합니다 · 부가세 별도</text>
</svg>
