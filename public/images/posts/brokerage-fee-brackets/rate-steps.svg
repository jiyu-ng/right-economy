<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="서울 주택 매매 중개보수 상한요율은 거래금액 구간에 따라 0.6퍼센트에서 0.4퍼센트로 내려갔다가 9억 이상부터 0.5, 0.6, 0.7퍼센트로 다시 올라가는 계단 모양이다">
  <rect width="640" height="320" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">요율은 오르기만 하지 않아요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">서울 주택 매매 중개보수 상한요율 · 세로축은 요율(%) · 가로 폭은 구간 넓이와 무관</text>

  <!-- 기준선 -->
  <line x1="60" y1="250" x2="608" y2="250" stroke="#D8D2C0" stroke-width="1"/>
  <text x="52" y="254" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">0</text>
  <line x1="60" y1="120" x2="608" y2="120" stroke="#EDE7D6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="52" y="124" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">0.7%</text>

  <!-- 막대: 0.6 / 0.5 / 0.4 / 0.5 / 0.6 / 0.7  (1% = 186px) -->
  <rect x="70"  y="138" width="80" height="112" rx="4" fill="#D8D2C0"/>
  <rect x="160" y="157" width="80" height="93"  rx="4" fill="#D8D2C0"/>
  <rect x="250" y="176" width="80" height="74"  rx="4" fill="#1F7A3D"/>
  <rect x="340" y="157" width="80" height="93"  rx="4" fill="#E8642F"/>
  <rect x="430" y="138" width="80" height="112" rx="4" fill="#E8642F"/>
  <rect x="520" y="120" width="80" height="130" rx="4" fill="#B4501F"/>

  <!-- 요율 라벨 -->
  <text x="110" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">0.6%</text>
  <text x="200" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">0.5%</text>
  <text x="290" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F7A3D">0.4%</text>
  <text x="380" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8642F">0.5%</text>
  <text x="470" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8642F">0.6%</text>
  <text x="560" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">0.7%</text>

  <!-- 구간 라벨 -->
  <text x="110" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">5천만 미만</text>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">5천만~2억</text>
  <text x="290" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F7A3D">2억~9억</text>
  <text x="380" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">9억~12억</text>
  <text x="470" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">12억~15억</text>
  <text x="560" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">15억 이상</text>

  <text x="290" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F7A3D">↑ 제일 낮은 자리</text>

  <text x="32" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">서울특별시 주택 중개보수 등에 관한 조례 별표1 (2021.12.30 시행) · 5천만 미만·5천만~2억 구간은 한도액 25·80만원이 따로 있습니다</text>
</svg>
