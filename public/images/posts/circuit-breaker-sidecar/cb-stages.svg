<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="한국 주식시장 서킷브레이커 3단계. 1단계는 지수가 8퍼센트 하락 시 20분 매매 중단, 2단계는 15퍼센트 하락 시 20분 중단, 3단계는 20퍼센트 하락 시 당일 장 종료">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">서킷브레이커 — 급락 시 '멈춤' 3단계</text>
  <text x="360" y="61" text-anchor="middle" font-size="12.5" fill="#8a6d5a">코스피·코스닥 지수가 전일 종가 대비 크게 떨어지면 단계별 발동</text>

  <!-- 1단계 -->
  <rect x="34" y="86" width="200" height="180" rx="14" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="134" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">1단계</text>
  <text x="134" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#e0852f">-8%</text>
  <text x="134" y="182" text-anchor="middle" font-size="12.5" fill="#5a4636">1분 이상 지속되면</text>
  <text x="134" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">20분간 매매 중단</text>
  <text x="134" y="234" text-anchor="middle" font-size="11.5" fill="#8a6d5a">숨 고르는 시간</text>

  <!-- 2단계 -->
  <rect x="260" y="86" width="200" height="180" rx="14" fill="#fdecdf" stroke="#eaddd3"/>
  <text x="360" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">2단계</text>
  <text x="360" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#d9662f">-15%</text>
  <text x="360" y="182" text-anchor="middle" font-size="12.5" fill="#5a4636">추가로 더 떨어지면</text>
  <text x="360" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">20분간 매매 중단</text>
  <text x="360" y="234" text-anchor="middle" font-size="11.5" fill="#8a6d5a">경고 수위 상승</text>

  <!-- 3단계 -->
  <rect x="486" y="86" width="200" height="180" rx="14" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="586" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#c0392b">3단계</text>
  <text x="586" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#c0392b">-20%</text>
  <text x="586" y="182" text-anchor="middle" font-size="12.5" fill="#8a5a52">여기까지 떨어지면</text>
  <text x="586" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c0392b">그날 장 종료</text>
  <text x="586" y="234" text-anchor="middle" font-size="11.5" fill="#b0857d">거래 완전 중단</text>

  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#b08968">일반 원리 · 각 단계 하루 1회 · 장 마감 임박 시 제한 등 세부 규정 있음 · 출처: 한국거래소 서킷브레이커 제도 기반</text>
</svg>
