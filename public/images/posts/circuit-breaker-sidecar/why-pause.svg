<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Pretendard, sans-serif" role="img" aria-label="매매를 잠깐 멈추면 공포에 휩쓸린 투매가 진정되고, 투자자가 정보를 확인하며 냉정을 되찾아 시장 붕괴를 막는다는 흐름 도식">
  <rect width="720" height="250" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">왜 '잠깐 멈추기'가 도움이 될까</text>

  <rect x="30" y="74" width="180" height="96" rx="12" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="120" y="108" text-anchor="middle" font-size="22">😱</text>
  <text x="120" y="136" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c0392b">공포의 투매</text>
  <text x="120" y="156" text-anchor="middle" font-size="11.5" fill="#8a5a52">"일단 팔자" 연쇄</text>

  <line x1="212" y1="122" x2="258" y2="122" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="262" y="74" width="196" height="96" rx="12" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="360" y="106" text-anchor="middle" font-size="22">⏸️</text>
  <text x="360" y="134" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">잠깐 멈춤</text>
  <text x="360" y="154" text-anchor="middle" font-size="11.5" fill="#5a4636">정보 확인·숨 고르기</text>

  <line x1="460" y1="122" x2="506" y2="122" stroke="#2f7d54" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect x="510" y="74" width="180" height="96" rx="12" fill="#e6f4ec" stroke="#bfe3cf"/>
  <text x="600" y="106" text-anchor="middle" font-size="22">🧊</text>
  <text x="600" y="134" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2f7d54">냉정 회복</text>
  <text x="600" y="154" text-anchor="middle" font-size="11.5" fill="#4a6b57">붕괴·과열 완화</text>

  <text x="360" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">기계적 공포 매도의 악순환을 끊어주는 '안전판'이에요</text>
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#b08968">일반적 취지 설명 · 실제 효과는 상황에 따라 다를 수 있음</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f7d54"/></marker>
  </defs>
</svg>
