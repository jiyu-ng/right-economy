<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, sans-serif" role="img" aria-label="재건축 이주장을 앞두고 세입자와 실수요자가 챙길 점을 정리한 표. 세입자는 이주 예정지 인근이면 갱신·이사 계획을 미리 세우고, 실수요자는 이주 시점이 조합 목표라 밀릴 수 있음을 감안하라는 내용">
  <rect width="720" height="260" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">이주장, 이렇게 대비해요</text>

  <g font-size="13.5" font-weight="800">
    <rect x="40" y="60" width="180" height="42" fill="#f6ede6"/>
    <rect x="220" y="60" width="460" height="42" fill="#fde3d3"/>
    <text x="130" y="87" text-anchor="middle" fill="#7c2d12">입장</text>
    <text x="450" y="87" text-anchor="middle" fill="#c2410c">챙길 점</text>
  </g>

  <g font-size="12.5">
    <text x="52" y="128" font-weight="700" fill="#7c2d12">세입자</text>
    <text x="234" y="128" fill="#5f4a3a">이주 예정지 인근이면 갱신·이사 계획을 미리. 이주 시작 전</text>
    <text x="234" y="146" fill="#5f4a3a">이 매물·가격이 상대적으로 여유로울 수 있어요.</text>

    <text x="52" y="184" font-weight="700" fill="#7c2d12">실수요·매수</text>
    <text x="234" y="184" fill="#5f4a3a">이주장엔 인근 전세 경쟁 심화. 단 이주 시점은 조합 '목표'라</text>
    <text x="234" y="202" fill="#5f4a3a">밀릴 수 있으니 시점 베팅은 신중히.</text>

    <text x="52" y="234" font-weight="700" fill="#7c2d12">집주인</text>
    <text x="234" y="234" fill="#5f4a3a">이주 수요기엔 인근 전세를 놓기 유리할 수 있으나 시기 확인 필수.</text>
  </g>

  <g stroke="#eaddd3" stroke-width="1">
    <line x1="40" y1="102" x2="680" y2="102"/>
    <line x1="40" y1="158" x2="680" y2="158"/>
    <line x1="40" y1="212" x2="680" y2="212"/>
    <line x1="220" y1="60" x2="220" y2="252"/>
  </g>
  <rect x="40" y="60" width="640" height="192" fill="none" stroke="#eaddd3"/>
</svg>
