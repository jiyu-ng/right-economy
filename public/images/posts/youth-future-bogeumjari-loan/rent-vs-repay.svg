<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="비아파트 평균 월세 약 80만원과 청년미래보금자리론 월 원리금 약 85만원을 비교한 막대그래프. 매달 내는 돈은 비슷하지만 월세는 남의 집에 내고 원리금은 내 집 지분이 쌓인다는 차이가 있다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">'월세만큼 내면 내 집'의 진짜 뜻</text>

  <!-- axis baseline -->
  <line x1="120" y1="210" x2="600" y2="210" stroke="#d8b9a5" stroke-width="1.5"/>

  <!-- bar 1: 월세 80 -->
  <rect x="180" y="90" width="110" height="120" rx="4" fill="#c9b7a8"/>
  <text x="235" y="80" text-anchor="middle" font-size="17" font-weight="800" fill="#8a6d5a">약 80만 원</text>
  <text x="235" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">비아파트 평균 월세</text>
  <text x="235" y="252" text-anchor="middle" font-size="12" fill="#8a6d5a">→ 남의 집에 내는 돈</text>

  <!-- bar 2: 원리금 85 -->
  <rect x="430" y="82" width="110" height="128" rx="4" fill="#e8853b"/>
  <text x="485" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#c2410c">약 85만 원</text>
  <text x="485" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">보금자리론 월 원리금</text>
  <text x="485" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#2f7d54">→ 내 집 지분이 쌓임</text>

  <text x="360" y="284" text-anchor="middle" font-size="11.5" fill="#b08968">대출 2억 원가량·연 3.0%·30년 가정 시 월 원리금 약 85만 원(원리금균등) · 4억은 주택가격 상한 · 비아파트 평균 월세는 정부 파악치 · 출처: 8·13 대책 보도</text>
</svg>
