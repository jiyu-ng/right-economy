<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, sans-serif" role="img" aria-label="청년미래보금자리론 이용 전 챙길 점 세 가지. 비아파트는 환금성과 시세방어가 약하고 전세사기 위험을 확인해야 하며, 시행 전이라 세부 조건이 바뀔 수 있고, 집값이나 금리가 오르면 부담이 커질 수 있다">
  <rect width="720" height="260" fill="#fffaf5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">좋아 보여도 — 들어가기 전 챙길 3가지</text>

  <g>
    <rect x="36" y="66" width="210" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <text x="141" y="98" text-anchor="middle" font-size="26">🏚️</text>
    <text x="141" y="128" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">비아파트 리스크</text>
    <text x="141" y="154" text-anchor="middle" font-size="12" fill="#5f4a3a">아파트보다 환금성·</text>
    <text x="141" y="172" text-anchor="middle" font-size="12" fill="#5f4a3a">시세방어 약해요.</text>
    <text x="141" y="194" text-anchor="middle" font-size="12" fill="#5f4a3a">전세사기·깡통 이력</text>
    <text x="141" y="210" text-anchor="middle" font-size="12" fill="#5f4a3a">꼭 확인.</text>
  </g>

  <g>
    <rect x="255" y="66" width="210" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <text x="360" y="98" text-anchor="middle" font-size="26">📅</text>
    <text x="360" y="128" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">아직 시행 전</text>
    <text x="360" y="154" text-anchor="middle" font-size="12" fill="#5f4a3a">2027년 1월 출시 예정.</text>
    <text x="360" y="172" text-anchor="middle" font-size="12" fill="#5f4a3a">금리·한도·요건 등</text>
    <text x="360" y="190" text-anchor="middle" font-size="12" fill="#5f4a3a">세부는 시행 전</text>
    <text x="360" y="208" text-anchor="middle" font-size="12" fill="#5f4a3a">바뀔 수 있어요.</text>
  </g>

  <g>
    <rect x="474" y="66" width="210" height="150" rx="10" fill="#fff" stroke="#eaddd3"/>
    <text x="579" y="98" text-anchor="middle" font-size="26">📈</text>
    <text x="579" y="128" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">부담은 변동</text>
    <text x="579" y="154" text-anchor="middle" font-size="12" fill="#5f4a3a">월 85만 원은 예시.</text>
    <text x="579" y="172" text-anchor="middle" font-size="12" fill="#5f4a3a">집값·금리 오르면</text>
    <text x="579" y="190" text-anchor="middle" font-size="12" fill="#5f4a3a">실제 부담은</text>
    <text x="579" y="208" text-anchor="middle" font-size="12" fill="#5f4a3a">더 커질 수 있어요.</text>
  </g>

  <text x="360" y="244" text-anchor="middle" font-size="11" fill="#b08968">정책 발표 내용 기반 · 실제 이용 전 공식 공고와 취급 기관에서 확정 조건 확인 필요</text>
</svg>
