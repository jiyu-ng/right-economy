name: Deploy redirect stub to GitHub Pages

# 옛 주소(right-economy.github.io)를 리다이렉트 전용으로 굴린다.
#
# 배경: 8/18 Cloudflare Pages 이전 후에도 GitHub Pages가 사이트 전체를 그대로
#   서빙해서 글 164편이 두 주소에 2벌 존재했다. 조직 대표 사이트(*.github.io)는
#   GitHub이 Pages 비활성화를 막아둬서(API 422) 끌 수가 없다.
#   → 끄는 대신 내용을 리다이렉트 한 장으로 갈아끼운다.
#
# pages-redirect/ 는 경로별 정적 스텁이다. dist 의 전 경로에 대해 같은 경로로
#   1:1 대응하는 파일을 두어, 옛 URL이 200 + canonical + meta refresh 로
#   새 주소의 같은 글을 가리키게 한다. (404 로 떨구면 링크 신호가 끊긴다)
#
# ⚠️ 이 워크플로는 Astro 를 빌드하지 않는다. 본 사이트 배포는 Cloudflare Pages 담당.
#   여기서 빌드하면 이전에 지운 이중 배포가 되살아난다.

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload redirect stub
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
